schema: spec-driven

context: |
  Tech stack: Astro 4.16, TypeScript strict, Tailwind CSS 3.4, npm, Node 20
  Architecture: static output (`output: "static"` in astro.config.mjs), no server adapter installed
  Testing: Vitest 2.1 (unit), Playwright 1.52 (E2E smoke), GitHub Actions CI
  SDD mode: OpenSpec artifact store, strict_tdd enabled, 400 changed-line review budget
  Current backend coupling: public product/admin data is fetched from an external product-admin API with local fallback data
  Style: Ecuadorian Spanish UI copy — tuteo only, never Rioplatense voseo ("cuéntanos", not "contás"). The business operates in Loja, Ecuador.
  Brand: magenta #a81452 / crema #fbebde / naranja #f49d50. Canonical brand assets and guidelines live outside this repo at ~/Documents/Negocio/el-horno-del-pinguino-branding
  Audience: the home page (/) targets consumers aged 16-30; business copy is a separate outbound-support surface

rules:
  proposal:
    guidelines:
      - Include rollback plan for risky changes
  specs:
    guidelines:
      - Use Given/When/Then for scenarios
      - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    guidelines:
      - Include sequence diagrams for complex flows
      - Document architecture decisions with rationale
  tasks:
    guidelines:
      - Group by phase, use hierarchical numbering
      - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing Astro component patterns
    tdd: true
    strict_tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test && npm run build && npm run test:e2e"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    guidelines:
      - Warn before merging destructive deltas
