name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept in its own job on purpose. When the audit ran as a step inside
  # build-and-test it short-circuited the job, so npm test, the build and the
  # E2E suite never executed — three merges landed on main with no test signal
  # at all. Separate jobs mean a failing audit and a failing test suite are
  # always reported independently.
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level moderate

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (production config — fixtures disabled)
        run: npm run build
      - name: Assert production build has no e2e-fixtures output
        run: |
          if [ -d "dist/e2e-fixtures" ]; then
            echo "dist/e2e-fixtures/catalog-batch was emitted by a production-config build (ENABLE_E2E_FIXTURES unset)." >&2
            echo "This must never ship to Cloudflare Pages — fixture-gate.ts's getStaticPaths gate is broken." >&2
            find dist/e2e-fixtures -type f >&2
            exit 1
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
